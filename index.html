<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmioVox Collections — Checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .brand .dot {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    .brand h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
    .amount {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .amount .label { color: #94a3b8; font-size: 14px; }
    .amount .value { font-size: 24px; font-weight: 700; color: #fff; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; margin-top: 16px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <form class="card" action="/pay" method="POST">
    <div class="brand">
      <div class="dot"></div>
      <h1>AmioVox Collections</h1>
    </div>
    <p class="subtitle">Secure Checkout</p>

    <div class="amount">
      <span class="label">Total due</span>
      <span class="value">$49.99</span>
    </div>

    <label for="name">Name on card</label>
    <input id="name" name="name" type="text" placeholder="Jane Doe" required />

    <label for="card">Card number</label>
    <input id="card" name="card" type="text" placeholder="1234 5678 9012 3456" required />

    <div class="row">
      <div>
        <label for="expiry">Expiry</label>
        <input id="expiry" name="expiry" type="text" placeholder="MM/YY" required />
      </div>
      <div>
        <label for="cvc">CVC</label>
        <input id="cvc" name="cvc" type="text" placeholder="123" required />
      </div>
    </div>

    <button type="submit">Pay $49.99</button>
    <p class="note">This is a demo page. No real payment is processed.</p>
  </form>
</body>
</html>
