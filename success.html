<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful — AmioVox Collections</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border: 1px solid #334155;
      text-align: center;
    }
    .check {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #059669);
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 38px; height: 38px; }
    h1 { font-size: 24px; color: #fff; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.5; }
    .amount {
      margin: 24px 0;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Thanks for your payment!</h1>
    <p>Hi {{ name }}, your payment to <strong>AmioVox Collections</strong> was received successfully.</p>
    <div class="amount">$49.99</div>
    <p>A confirmation has been sent to your email.</p>
    <a href="/">Back to checkout</a>
  </div>
</body>
</html>
